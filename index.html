<title>Форма</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка шириной с телефон. Бумага и краска, плюс один цвет дня — он меняется каждый день и заливает плакат наверху. Цвет дня только заливкой, текст всегда краской. */
:root{
  --paper:#f2f3f0; --ink:#101312; --mute:#69706c; --rule:#cdd1cc; --tint:#e4e7e2;
  --day:#e34234; --on-day:#ffffff;
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d0f0e;--ink:#f1f3ef;--mute:#8c938e;--rule:#2b302d;--tint:#191c1a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0d0f0e;--ink:#f1f3ef;--mute:#8c938e;--rule:#2b302d;--tint:#191c1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.sec{padding-block:20px;display:flex;flex-direction:column;gap:14px}
.sec+.sec{border-top:2px solid var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08;font-weight:800;letter-spacing:-.02em}
h1{font-size:34px} h2{font-size:21px;font-weight:600} h3{font-size:16px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.mute{color:var(--mute)} .small{font-size:14px}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* плакат дня */
.poster{background:var(--day);color:var(--on-day);position:relative;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gr) 18px var(--gl);display:flex;flex-direction:column;gap:6px;margin-top:calc(-1*env(safe-area-inset-top,0px))}
.poster .num{font-family:var(--display);font-weight:800;font-size:min(31vw,148px);line-height:.86;letter-spacing:-.05em;margin:14px 0 10px -.04em}
.poster .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.poster .foot b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}
.crop{position:absolute;width:12px;height:12px;border:0 solid currentColor;opacity:.75}
.crop.a{right:8px;bottom:8px;border-right-width:1.5px;border-bottom-width:1.5px}
.crop.b{left:8px;bottom:8px;border-left-width:1.5px;border-bottom-width:1.5px}
.head{padding-block:calc(22px) 16px;display:flex;flex-direction:column;gap:8px}
.head .sw{width:44px;height:8px;background:var(--day)}

.statement{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.28;letter-spacing:-.01em;text-wrap:pretty}

.task{display:flex;flex-direction:column;gap:10px}
.task .mark{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.task.done h2{text-decoration:line-through;text-decoration-thickness:2px}

.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:52px;padding:12px 18px;background:var(--ink);color:var(--paper);
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.01em;text-decoration:none;text-align:center;width:100%}
.btn:active{transform:translateY(1px)}
.btn.day{background:var(--day);color:var(--on-day)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.sm{min-height:42px;padding:8px 12px;font-size:12px}
.btn.auto{width:auto}
.link{font-family:var(--mono);font-size:12px;text-decoration:underline;text-underline-offset:3px;color:var(--mute);padding:8px 0;text-align:left}

.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fig b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.03em}
.fig span{display:block;margin-top:6px}

svg.ruler,svg.chart{width:100%;height:auto;display:block;overflow:visible}
.kg{font-family:var(--display);font-weight:800;font-size:54px;line-height:.9;letter-spacing:-.04em}
.kg small{font-size:18px;font-weight:600;letter-spacing:0}

input[type=number],input[type=text]{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:8px 0;min-height:46px;width:100%;font-size:20px;font-weight:600}
input::placeholder{color:var(--mute);font-weight:400}
label{display:flex;flex-direction:column;gap:2px}

/* вылазка */
.brief{background:var(--tint);padding:16px;display:flex;flex-direction:column;gap:8px}
.brief .t{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-.01em}
.dice{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px}
.die{width:168px;height:168px}
.die text{font-family:var(--display);font-weight:800;font-size:34px;fill:var(--ink)}
.die.roll{animation:shake .7s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#radar{width:100%;max-width:360px;aspect-ratio:1;display:block;margin:0 auto}
.pt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--rule)}
.pt:first-child{border-top:0}
.pt i{width:14px;height:14px;flex:none;border:2px solid var(--ink)}
.pt[aria-pressed=true] i{background:var(--day);border-color:var(--day)}
.pt .d{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:-.02em}
.timer{font-family:var(--display);font-weight:800;font-size:min(27vw,128px);line-height:.9;letter-spacing:-.05em}

/* веер */
.fan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;text-align:left;background:var(--tint);min-width:0}
.chip .c{aspect-ratio:1/1.05}
.chip .l{padding:7px 8px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip .l b{font-size:12.5px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.chip .l span{font-family:var(--mono);font-size:10px;color:var(--mute)}
.chip.no .c{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--rule) 5px 6px)}
.chip.no b{color:var(--mute);font-weight:400}
.entry{padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:12px}
.entry i{width:10px;flex:none;align-self:stretch}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{padding:17px 0 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--mute)}
nav button[aria-current=page]{background:var(--ink);color:var(--paper)}

#ov{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl)}
#ov.flood{background:var(--day);color:var(--on-day)}
#ov.flood .btn{background:var(--on-day);color:var(--day)}
#ov.flood .mute{color:inherit;opacity:.8}
#ov .in{max-width:448px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
#ov .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.huge{font-family:var(--display);font-weight:800;font-size:min(34vw,160px);line-height:.86;letter-spacing:-.05em;margin-left:-.04em}
.huge small{display:block;font-size:20px;font-weight:600;letter-spacing:0;margin:10px 0 0 .25em}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:6px;background:var(--rule)}
.segs i.on{background:var(--ink)} .segs i.cur{background:var(--day)}
.loot{display:flex;flex-wrap:wrap;gap:6px}
.loot span{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 9px;box-shadow:inset 0 0 0 1.5px currentColor}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:11px 16px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
/* позы и еда */
.poses{display:grid;gap:8px}
.poses.two{grid-template-columns:1fr 1fr}
.poses.one{grid-template-columns:minmax(0,62%);justify-content:start}
.poses>div{display:flex;flex-direction:column;gap:5px}
.figure{width:100%;display:block;background:var(--tint)}
.figure .bd{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.figure .pr{fill:none;stroke:var(--mute);stroke-width:3;stroke-linecap:square}
.figure .fl{stroke:var(--day);stroke-width:5}
.figure .hd{fill:var(--ink)}
.figure .hint{fill:none;stroke:var(--day);stroke-width:3;stroke-dasharray:5 5}
.cues{margin:0;padding:0;list-style:none}
.cues li{padding:8px 0 8px 20px;border-top:1px solid var(--rule);position:relative}
.cues li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:8px;background:var(--ink)}
.glasses{display:flex;gap:6px;margin-top:8px}
.glasses button{flex:1;aspect-ratio:1/1.5;max-width:40px;box-shadow:inset 0 0 0 2px var(--ink)}
.glasses button[aria-pressed=true]{background:var(--day);box-shadow:inset 0 0 0 2px var(--ink)}
.key{width:16px;height:16px;flex:none;align-self:flex-start;margin-top:4px}
</style>

</div></nav>

function migrate(o){
  if(!o)return null;
  if(o.v===2)return Object.assign(blank(),o);
  if(o.v===1&&o.hero){const n=blank(),h=o.hero;n.hero={name:h.name,height:h.height,startW:h.startW,goalW:h.goalW,created:h.created};
    n.weights=o.weights||[];n.workouts=o.workouts||0;n.km=o.km||0;n.xp=o.xp||0;n.spare=o.charms==null?1:o.charms;n.frozen=o.frozen||{};n.updatedAt=o.updatedAt||0;
    for(const k in o.days||{}){const d=o.days[k];n.days[k]={w:!!d.w,k:!!d.k,full:!!d.full};if(d.k)n.briefs++}return n}
  return null;
}
function loadLocal(){try{const r=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(r){const o=migrate(JSON.parse(r));if(o)S=o}}catch(e){}}

/* облако: личная запись зрителя, чтобы прогресс не зависел от одного браузера */
let cloud=null,cloudBusy=false,cloudDirty=false,cloudTimer=null;
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){syncState="local";paintSync();return}
    const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){syncState="local";paintSync();return}
    const id=await user.id();if(!id){syncState="local";paintSync();return}
    const ref=db.doc("data/users/"+id+"/save"),snap=await ref.get();cloud=ref;
    if(snap.exists){const r=snap.data();
      if(r&&r.json&&r.updatedAt>(S.updatedAt||0)){const o=migrate(JSON.parse(r.json));if(o&&o.hero&&!W){S=o;saveLocal();boot()}}
      else if(S.hero)pushCloud();
    }else if(S.hero)pushCloud();
    syncState="cloud";paintSync();
  }catch(e){syncState="local";paintSync()}
}
function pushCloud(){if(!cloud)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1500)}
async function flushCloud(){
  if(!cloud||cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;
  try{await cloud.set({json:JSON.stringify(S),updatedAt:S.updatedAt});syncState="cloud"}catch(e){syncState="local"}
  cloudBusy=false;paintSync();if(cloudDirty)pushCloud();
}
const syncText=()=>syncState==="cloud"?"Прогресс сохранён в аккаунте":syncState==="local"?"Прогресс хранится только в этом браузере":"";

/* ───────── правила ───────── */
const isActive=k=>{const d=S.days[k];return !!(d&&(d.w||d.k))};
const activeDays=()=>Object.keys(S.days).filter(isActive).length;
function streak(){let k=ymd(),n=0;if(!isActive(k))k=addDays(k,-1);while(isActive(k)||S.frozen[k]){if(isActive(k))n++;k=addDays(k,-1)}return n}
function reconcile(){ // запасной день прикрывает пропуск, только если запаса хватает на весь разрыв
  const keys=Object.keys(S.days).filter(isActive).sort();if(!keys.length)return 0;
  const last=keys[keys.length-1],t=ymd(),miss=[];
  for(let k=addDays(last,1);k<t;k=addDays(k,1))if(!S.frozen[k])miss.push(k);
  if(miss.length&&miss.length<=S.spare){miss.forEach(k=>S.frozen[k]=true);S.spare-=miss.length;return miss.length}
  return miss.length?-miss.length:0;
}
const level=()=>{let n=1;while(n<20&&75*n*(n+1)<=S.xp)n++;return n};
const lvlFloor=n=>75*n*(n-1);
const title=()=>TITLES.find(t=>level()>=t[0])[1];
const tier=()=>Math.min(6,Math.floor(S.workouts/6));
const today=()=>S.days[ymd()]||(S.days[ymd()]={});
const curW=()=>S.weights.length?S.weights[S.weights.length-1].kg:S.hero.startW;
const dayNo=()=>activeDays()+(isActive(ymd())?0:1);
function colorOf(k){const d=toDate(k),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);const i=(n*7)%COLORS.length;return{i,name:COLORS[i][0],hex:COLORS[i][1]}}
function onColor(hex){const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)),L=.2126*c[0]+.7152*c[1]+.0722*c[2];
  return(L+.05)/.05>=1.05/(L+.05)?"#101312":"#ffffff"}
function paintDay(){const c=colorOf(ymd()),r=document.documentElement.style;r.setProperty("--day",c.hex);r.setProperty("--on-day",onColor(c.hex))}
function markDay(type){
  const d=today(),first=!isActive(ymd());d[type]=true;const out=[];
  if(first){const s=streak();if(s>0&&s%7===0&&S.spare<3){S.spare++;out.push("запасной день +1")}}
  if(d.w&&d.k&&!d.full){d.full=true;S.xp+=30;out.push("день целиком +30")}
  return out;
}

  let rate=.5/7,src="при спокойном темпе 0,5 кг в неделю";

}
function ruler(){
  const h=S.hero,a=h.startW,b=h.goalW,c=Math.max(b,Math.min(a,curW())),span=a-b||1,X=k=>4+(a-k)/span*312,n=Math.floor(span),step=n>45?5:1;let t="";
  for(let i=0;i<=n;i+=step){const big=i%5===0;t+=`<line x1="${X(a-i)}" x2="${X(a-i)}" y1="26" y2="${big?40:34}" stroke="var(--ink)" stroke-width="${big?1.5:1}"/>`}
  return `<svg class="ruler" viewBox="0 0 320 62" role="img" aria-label="Линейка от ${fmt(a)} до ${fmt(b)} кг, сейчас ${fmt(c)}">

}

const R=6371000,rad=x=>x*Math.PI/180;
function dist(a,b){const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function bearing(a,b){const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function offset(p,brg,m){return{lat:p.lat+Math.cos(rad(brg))*m/110540,lon:p.lon+Math.sin(rad(brg))*m/(111320*Math.cos(rad(p.lat)))}}
const compass=b=>["на север","на северо-восток","на восток","на юго-восток","на юг","на юго-запад","на запад","на северо-запад"][Math.round(b/45)%8];
const reach=()=>Math.min(900,350+60*tier());
function spawn(p){const base=reach(),start=Math.random()*360;return[0,1,2].map(i=>offset(p,start+i*120+(Math.random()-.5)*50,base*(.8+Math.random()*.5)))}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
function startGps(){
  gps.err=null;if(!navigator.geolocation){gps.err="no";render();return}
  toast("Ищу тебя на карте…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const p={lat:pos.coords.latitude,lon:pos.coords.longitude};
    S.walk={mode:"gps",start:Date.now(),targets:spawn(p),trail:[[p.lat,p.lon]],dist:0,banked:0};
    gps.pos=Object.assign({acc:pos.coords.accuracy,t:Date.now()},p);gps.sel=0;gps.ref=null;gps.trend=null;
    $("#toast").hidden=true;save();watch();wake();render();
  },()=>{gps.err="denied";$("#toast").hidden=true;render()},{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
function watch(){if(gps.id!=null||!navigator.geolocation||!S.walk||S.walk.mode!=="gps")return;
  gps.id=navigator.geolocation.watchPosition(onFix,()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}
function unwatch(){if(gps.id!=null){try{navigator.geolocation.clearWatch(gps.id)}catch(e){}gps.id=null}}
function onFix(pos){
  const w=S.walk;if(!w||w.mode!=="gps")return;
  const p={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now(),head:pos.coords.heading};gps.pos=p;
  if(p.acc<=45){const l=w.trail[w.trail.length-1],d=dist({lat:l[0],lon:l[1]},p),dt=Math.max(1,(p.t-(w.lt||w.start))/1000);
    // шаг засчитывается от 10 м; скачок GPS не даёт больше, чем быстрый шаг за это время
    if(d>=10){w.dist+=Math.min(d,dt*3);w.lt=p.t;w.trail.push([p.lat,p.lon]);if(w.trail.length>400)w.trail.shift();saveLocal()}}
  if(!w.arrived){
    const t=w.targets[gps.sel];
    if(t){const d=dist(p,t);if(!gps.ref||p.t-gps.ref.t>12000){if(gps.ref&&gps.ref.i===gps.sel){const dd=gps.ref.d-d;gps.trend=dd>6?"hot":dd<-6?"cold":gps.trend}gps.ref={d,t:p.t,i:gps.sel}}}
    if(w.targets.some(x=>dist(p,x)<=40)){arrive();return}
  }
  if(tab==="walk"&&!W&&$("#ov").hidden&&document.activeElement.id!=="note")render();
}
function arrive(){const w=S.walk;w.arrived=true;saveLocal();beep();if(tab==="walk"&&!W)render();toast("Ты на точке. Ищи по брифу.")}
function bank(){const w=S.walk;if(!w)return;
  if(w.mode==="gps"){const d=(w.dist-w.banked)/1000;if(d>0){S.km+=d;w.banked=w.dist}}
  else if(!w.bankedT){S.km+=Math.min((Date.now()-w.start)/60000,w.dur*1.5)*.075;w.bankedT=true}}
function endWalk(){bank();const w=S.walk;S.walk=null;unwatch();gps.pos=null;save();if(w&&w.mode==="gps")toast("Маршрут: "+fmt(w.dist/1000)+" км");render()}

function briefCard(d,c){return `<div class="brief"><div class="row between cap"><span>Бриф · d20: ${S.brief.r}</span><span>${esc(c.name)} ${c.hex}</span></div><p class="t">${esc(BRIEFS[S.brief.r])}</p></div>`}
function closeForm(label){return `<form id="bform" class="stack"><label><span class="cap mute">Что нашёл (по желанию)</span><input type="text" id="note" maxlength="140" autocomplete="off" placeholder="вывеска аптеки на углу"></label>
  <button class="btn day">${label}</button></form>`}
function vWalk(){
  const w=S.walk,d=S.days[ymd()]||{},c=colorOf(ymd());
  if(w&&w.done)return head("Дорога домой","Бриф закрыт. Обратный путь тоже идёт в километраж.")+
    `<section class="sec pad"><span class="cap mute">Пройдено</span><div class="timer">${fmt(w.dist/1000)}<span style="font-size:.2em;letter-spacing:0"> км</span></div>
     <canvas id="radar" width="720" height="720" aria-label="Твой след"></canvas><button class="btn" data-act="endwalk">Я дома</button></section>`;
  if(!S.brief&&w){S.walk=null;unwatch()}
  if(!S.brief)return head("Вылазка","Двадцать брифов для глаз, один выпадет тебе. Искать придётся ногами.")+
    `<section class="sec pad"><div class="dice"><div id="die-slot">${dieSvg("d20")}</div><button class="btn day" data-act="roll">Бросить d20</button></div>
     <p class="small mute">Цвет дня сегодня ${esc(c.name)}. Закроешь бриф, и он попадёт в твой веер образцов.</p></section>`;
  if(!w){
    const note=gps.err==="denied"?`<p class="small"><b>GPS здесь не отвечает.</b> <span class="mute">Так бывает, когда страница открыта внутри Claude или доступ к геопозиции запрещён в браузере. Вылазка по времени работает везде.</span></p>`
      :gps.err==="no"?`<p class="small"><b>На этом устройстве нет геопозиции.</b> <span class="mute">Выбери вылазку по времени.</span></p>`:"";
    return head("Вылазка","Бриф выпал. Теперь выбери, как идти.")+
    `<section class="sec pad">${briefCard(d,c)}${S.brief.re?"":`<button class="link" data-act="reroll">Перебросить (один раз)</button>`}</section>
     <section class="sec pad"><h2>До точки</h2><p class="mute">Нужен GPS. Три точки в ${Math.round(reach()/50)*50} метрах от тебя. Дойди до любой и ищи вокруг неё.</p>${note}
      <button class="btn" data-act="gps">Идти по GPS</button></section>
     <section class="sec pad"><h2>По времени</h2><p class="mute">Без GPS. Иди куда хочешь и ищи по дороге.</p>
      <div class="modes"><button class="btn line" data-act="timer" data-m="15">15 мин</button><button class="btn line" data-act="timer" data-m="25">25 мин</button><button class="btn line" data-act="timer" data-m="40">40 мин</button></div>
      <p class="small mute">Темп такой, чтобы можно было говорить, но не петь. И смотри на дорогу, а не в телефон.</p></section>`;
  }
  if(w.mode==="timer"){
    const left=w.dur*60-(Date.now()-w.start)/1000;
    return head("Вылазка","Телефон можно убрать в карман. Развернись на половине времени.")+
    `<section class="sec pad">${briefCard(d,c)}</section>
     <section class="sec pad"><span class="cap mute">${left>0?"Осталось идти":"Время вышло"}</span><div class="timer" id="wtimer">${mmss(left)}</div>
      ${left<=0?closeForm("Бриф выполнен"):""}<button class="link" data-act="endwalk">Закончить без брифа</button></section>`;
  }
  const p=gps.pos;
  if(w.arrived)return head("Ты на точке","Осмотрись. Бриф где-то рядом.")+
    `<section class="sec pad">${briefCard(d,c)}${closeForm("Бриф выполнен")}</section>
     <section class="sec pad"><p class="cap mute">Пройдено ${fmt(w.dist/1000)} км</p><button class="link" data-act="endwalk">Закончить без брифа</button></section>`;
  const list=w.targets.map((t,i)=>{const dd=p?dist(p,t):null;
    return `<button class="pt" data-act="sel" data-i="${i}" aria-pressed="${i===gps.sel}"><i></i>
     <span class="grow"><b>Точка ${"АБВ"[i]}</b><br><span class="small mute">${dd==null?"…":compass(bearing(p,t))+" · около "+Math.max(1,Math.round(dd/75))+" мин"}</span></span>
     <span class="d">${dd==null?"—":dd>=1000?fmt(dd/1000)+" км":Math.round(dd)+" м"}</span></button>`}).join("");
  const t=w.targets[gps.sel],near=p&&t&&dist(p,t)<=150;
  return head("Вылазка",`Пройдено ${fmt(w.dist/1000)} км. Дойди до любой точки.`)+
   `<section class="sec pad">${briefCard(d,c)}</section>
    <section class="sec pad"><canvas id="radar" width="720" height="720" aria-label="Радар: ты в центре, север сверху"></canvas>
     <p class="small" style="text-align:center">${!p?`<span class="mute">Жду сигнал GPS…</span>`:gps.trend==="hot"?`<b>Теплее. Так держать.</b>`:gps.trend==="cold"?`<b>Холоднее. Попробуй свернуть.</b>`:`<span class="mute">Север сверху. Пройди шагов тридцать, и след покажет, куда ты идёшь.</span>`}
      ${p&&p.acc>45?`<br><span class="mute">Сигнал слабый (±${Math.round(p.acc)} м). Выйди на открытое место.</span>`:""}</p>
     <div>${list}</div>
     ${t?`<a class="btn line sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${t.lat.toFixed(5)}&mlon=${t.lon.toFixed(5)}#map=17/${t.lat.toFixed(5)}/${t.lon.toFixed(5)}">Выбранная точка на карте</a>`:""}
     ${near?`<button class="btn day" data-act="manual">Я на месте</button>`:""}
     <div class="row"><button class="btn line sm" data-act="respawn">Туда не пройти</button><button class="btn line sm" data-act="endwalk">Закончить</button></div>
     <p class="small mute">Не гаси экран: с погасшим экраном браузер перестаёт следить за дорогой.</p></section>`;
}
function drawRadar(){
  const cv=$("#radar"),w=S.walk;if(!cv||!w||w.mode!=="gps")return;const g=cv.getContext("2d"),Z=720,c=Z/2,st=getComputedStyle(document.documentElement),css=k=>st.getPropertyValue(k).trim();
  g.clearRect(0,0,Z,Z);const l=w.trail[w.trail.length-1],p=gps.pos||{lat:l[0],lon:l[1]},pts=w.arrived?[]:w.targets;
  let far=120;pts.forEach(t=>far=Math.max(far,dist(p,t)));w.trail.forEach(q=>far=Math.max(far,dist(p,{lat:q[0],lon:q[1]})));
  const step=far>600?200:far>250?100:50,maxR=Math.ceil(far*1.12/step)*step,sc=(c-40)/maxR;
  const xy=q=>[c+(q.lon-p.lon)*111320*Math.cos(rad(p.lat))*sc,c-(q.lat-p.lat)*110540*sc];
  g.fillStyle=css("--tint");g.fillRect(0,0,Z,Z);
  g.strokeStyle=css("--rule");g.lineWidth=2;g.font="500 22px 'JetBrains Mono', monospace";g.textAlign="center";
  for(let r=step;r<=maxR;r+=step){g.beginPath();g.arc(c,c,r*sc,0,7);g.stroke();g.fillStyle=css("--mute");g.fillText(r+" м",c,c-r*sc+26)}
  g.beginPath();g.moveTo(c,0);g.lineTo(c,Z);g.moveTo(0,c);g.lineTo(Z,c);g.stroke();
  g.fillStyle=css("--ink");g.font="700 24px 'JetBrains Mono', monospace";g.fillText("С",c+22,30);
  if(w.trail.length>1){g.strokeStyle=css("--ink");g.lineWidth=6;g.lineJoin="round";g.beginPath();w.trail.forEach((q,i)=>{const[x,y]=xy({lat:q[0],lon:q[1]});i?g.lineTo(x,y):g.moveTo(x,y)});g.lineTo(c,c);g.stroke()}
  pts.forEach((t,i)=>{const[x,y]=xy(t),s=i===gps.sel?26:18;if(i===gps.sel){g.fillStyle=css("--day");g.fillRect(x-s,y-s,s*2,s*2)}
    g.strokeStyle=css("--ink");g.lineWidth=4;g.strokeRect(x-s,y-s,s*2,s*2);g.fillStyle=css("--ink");g.font="700 22px 'JetBrains Mono', monospace";g.fillText("АБВ"[i],x,y-s-10)});
  if(gps.pos&&gps.pos.head!=null&&!isNaN(gps.pos.head)){const a=rad(gps.pos.head-90);g.fillStyle=css("--ink");g.globalAlpha=.22;g.beginPath();g.moveTo(c,c);g.arc(c,c,80,a-.45,a+.45);g.closePath();g.fill();g.globalAlpha=1}
  g.fillStyle=css("--ink");g.beginPath();g.arc(c,c,14,0,7);g.fill();g.strokeStyle=css("--paper");g.lineWidth=5;g.stroke();
}
function doRoll(re){
  if(rolling)return;rolling=true;$("#die-slot").innerHTML=dieSvg("?","roll");
  const iv=setInterval(()=>{const n=$("#dnum");if(n)n.textContent=1+Math.floor(Math.random()*20)},70);
  setTimeout(()=>{clearInterval(iv);rolling=false;S.brief={r:1+Math.floor(Math.random()*20),re:!!re};save();beep();render()},750);
}
function closeBrief(note){
  const d=today(),c=colorOf(ymd()),r=S.brief.r,n=d.briefsDone||0,isNew=!S.swatches[c.i],before=level();
  let xp=n>=2?15:70;if(r===20)xp*=2;
  S.xp+=xp;S.briefs++;d.briefsDone=n+1;if(isNew)S.swatches[c.i]=ymd();
  S.journal.push({d:ymd(),r,c:c.i,note:note.slice(0,140)});if(S.journal.length>300)S.journal.shift();
  const extra=markDay("k");S.brief=null;bank();
  const w=S.walk;if(w&&w.mode==="gps"){w.done=true;w.arrived=true}else S.walk=null;
  if(level()>before)extra.unshift("уровень "+level()+" · "+title());
  greet=null;save();beep();
  showOv(`<div class="in"><div class="row between cap"><span>Бриф закрыт</span><span>d20: ${r}</span></div><div class="mid">
    <span class="cap">${isNew?"Новый образец в веере":"Образец уже в веере"}</span><div class="huge" style="font-size:min(15vw,72px);line-height:1">${esc(c.name)}</div><span class="mono">${c.hex}</span>
    <div class="loot"><span>+${xp} опыта</span>${extra.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    <p class="statement">${esc(pick(SAY.walk))}</p></div><button class="btn" data-act="closeov">Дальше</button></div>`,true);
}

/* ───────── тренировка ───────── */
function startWorkout(){
  const prog=PROGRAMS[S.workouts%3],t=tier(),steps=[];
  prog.steps.forEach(x=>{for(let i=1;i<=x.sets;i++)steps.push(Object.assign({},x,{amt:x.base+x.inc*t,set:x.sets>1?i+"/"+x.sets:""}))});
  W={prog,steps,i:0,phase:"work",end:null,again:!!(S.days[ymd()]||{}).w};wake();showOv(vWorkout());
}
function vWorkout(){
  const s=W.steps[W.i];
  const top=`<div class="stack" style="gap:10px"><div class="row between cap"><span>${esc(W.prog.n)} · ${W.i+1}/${W.steps.length}</span><button class="link" style="padding:0" data-act="quit">Прервать</button></div>
   <div class="segs">${W.steps.map((_,j)=>`<i class="${j<W.i?"on":j===W.i?"cur":""}"></i>`).join("")}</div></div>`;
  if(W.phase==="rest")return `<div class="in">${top}<div class="mid"><span class="cap mute">Отдых</span><div class="huge" id="wt">${mmss((W.end-Date.now())/1000)}</div>
    <div class="stack" style="gap:8px"><span class="cap mute">Дальше: ${esc(s.n)}${s.set?", подход "+s.set:""}</span>${poses(s.fig)}</div></div><button class="btn line" data-act="skiprest">Я готов</button></div>`;
  const run=W.end!=null;
  return `<div class="in">${top}<div class="stack" style="flex:1;gap:14px"><div><span class="cap mute">${s.set?"Подход "+s.set:"Один подход"}</span><h1 style="font-size:26px">${esc(s.n)}</h1></div>
    ${poses(s.fig)}
    <div class="huge" style="font-size:min(21vw,96px)">${s.kind==="time"?`<span id="wt">${mmss(run?(W.end-Date.now())/1000:s.amt)}</span>`:s.amt+`<small style="display:inline;margin-left:.4em">${plural(s.amt,"раз","раза","раз")}</small>`}</div>
    ${technique(s)}</div>
    ${s.kind==="time"?(run?`<button class="btn line" data-act="stepdone">Закончить раньше</button>`:`<button class="btn day" data-act="steptimer">Старт</button>`):`<button class="btn" data-act="stepdone">Готово</button>`}</div>`;
}
function stepDone(){W.end=null;W.i++;if(W.i>=W.steps.length){finishWorkout();return}W.phase="rest";W.end=Date.now()+30000;showOv(vWorkout())}
function finishWorkout(){
  const before=level(),xp=W.again?20:60,name=W.prog.n;S.xp+=xp;S.workouts++;
  const extra=markDay("w");if(level()>before)extra.unshift("уровень "+level()+" · "+title());W=null;greet=null;save();beep();
  showOv(`<div class="in"><div class="row between cap"><span>Тренировка закрыта</span><span>№ ${S.workouts}</span></div><div class="mid">
   <div class="huge" style="font-size:min(17vw,84px);line-height:1">${esc(name)}</div>
   <div class="loot"><span>+${xp} опыта</span>${extra.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
   <p class="statement">${esc(pick(SAY.workout))}</p>
   <p class="small mute">${S.workouts%6===0?"Нагрузка немного вырастет: ты готов.":"Каждые шесть тренировок нагрузка чуть растёт."}</p></div>
   <button class="btn" data-act="closeov">Готово</button></div>`,true);
}

/* ───────── знакомство ───────── */
function vOnboard(){return `<div class="in"><div class="row between cap"><span>Форма</span><span>Старт</span></div>
 <div><div class="huge" style="font-size:min(22vw,104px)">Форма</div></div>
 <p class="statement">Каждый день два дела: короткая тренировка дома и вылазка в город с дизайн-брифом. Тело в форму, глаз в тонус.</p>
 <form id="ob" class="stack" style="gap:18px"><label><span class="cap mute">Как тебя звать</span><input type="text" id="ob-name" maxlength="24" required autocomplete="off"></label>
  <div class="row" style="gap:18px"><label class="grow"><span class="cap mute">Рост, см</span><input type="number" id="ob-h" inputmode="numeric" min="120" max="230" required></label>
   <label class="grow"><span class="cap mute">Вес, кг</span><input type="number" id="ob-w" inputmode="decimal" step="0.1" min="35" max="300" required></label></div>
  <label><span class="cap mute">Вес мечты, кг</span><input type="number" id="ob-g" inputmode="decimal" step="0.5" min="35" max="250" required></label>
  <p class="small mute" id="ob-hint">Введи рост, и я подскажу здоровый диапазон. Цель потом можно поменять.</p>
  <button class="btn day">Начать</button></form></div>`}
function obHint(){const h=+$("#ob-h").value,el=$("#ob-hint");if(el&&h>=120&&h<=230){const m=h/100;el.textContent=`Для роста ${h} см в норму попадает вес ${Math.ceil(18.5*m*m)}–${Math.floor(24.9*m*m)} кг. Можно начать с промежуточной цели и потом сдвинуть.`}}

/* ───────── оверлей, тосты, звук ───────── */
function showOv(html,flood){const o=$("#ov");o.className=flood?"flood":"";o.innerHTML=html;o.hidden=false;o.scrollTop=0;$("#toast").hidden=true}
function closeOv(){const o=$("#ov");o.hidden=true;o.innerHTML="";render()}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
let AC;function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=660;
  g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.45);o.start();o.stop(AC.currentTime+.45)}catch(e){}
  try{if(navigator.userActivation&&navigator.userActivation.hasBeenActive&&navigator.vibrate)navigator.vibrate(200)}catch(e){}}

/* ───────── события ───────── */
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);if(tab==="walk")watch();return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="workout")startWorkout();
  else if(a==="tech")showOv(vTech());
  else if(a==="sex"){FS=b.dataset.v;const v=$("#f-age").value;render();$("#f-age").value=v}
  else if(a==="foodedit"){foodEdit=true;FS=S.hero.sex||"m";render();window.scrollTo(0,0)}
  else if(a==="habit"){const fd=foodOf(today());fd.h[b.dataset.k]=!fd.h[b.dataset.k];foodTouched()}
  else if(a==="water"){const fd=foodOf(today()),n=+b.dataset.n;fd.water=fd.water===n?n-1:n;foodTouched()}
  else if(a==="steptimer"){W.end=Date.now()+W.steps[W.i].amt*1000;beep();showOv(vWorkout())}
  else if(a==="stepdone")stepDone();
  else if(a==="skiprest"){W.phase="work";W.end=null;showOv(vWorkout())}
  else if(a==="quit"){W=null;closeOv();toast("Прервано. Вернёшься, когда будешь готов.")}
  else if(a==="closeov")closeOv();
  else if(a==="roll")doRoll(false);
  else if(a==="reroll"){S.brief=null;render();doRoll(true)}
  else if(a==="gps")startGps();
  else if(a==="timer"){S.walk={mode:"timer",start:Date.now(),dur:+b.dataset.m};save();wake();render()}
  else if(a==="sel"){gps.sel=+b.dataset.i;gps.ref=null;gps.trend=null;render()}
  else if(a==="manual")arrive();
  else if(a==="respawn"){if(gps.pos){S.walk.targets=spawn(gps.pos);gps.sel=0;gps.ref=null;gps.trend=null;save();render();toast("Точки переставлены")}else toast("Сначала дождёмся сигнала GPS")}
  else if(a==="endwalk")endWalk();
  else if(a==="reset1"){$("#reset-slot").innerHTML=`<div class="row wrap"><span class="small grow">Весь прогресс сотрётся. Точно?</span><button class="btn sm auto" data-act="reset2">Стереть</button><button class="btn line sm auto" data-act="reset0">Оставить</button></div>`}
  else if(a==="reset0"){$("#reset-slot").innerHTML=""}
  else if(a==="reset2"){unwatch();S=blank();save();try{localStorage.removeItem(OLD)}catch(e){}tab="today";greet=null;boot()}
});
document.addEventListener("input",ev=>{if(ev.target.id==="ob-h")obHint()});
document.addEventListener("submit",ev=>{
  ev.preventDefault();const id=ev.target.id,num=s=>+String($(s).value).replace(",",".");
  if(id==="ob"){const name=$("#ob-name").value.trim(),h=num("#ob-h"),w=num("#ob-w"),g=num("#ob-g");
    if(!name||!h||!w||!g)return;if(g>=w){toast("Цель должна быть меньше нынешнего веса");return}
    S.hero={name,height:h,startW:w,goalW:g,created:ymd()};S.weights=[{d:ymd(),kg:w}];save();closeOv()}
  else if(id==="bform")closeBrief($("#note").value.trim());
  else if(id==="wform"){const v=num("#w-in");if(!(v>=30&&v<=300)){toast("Введи вес в килограммах");return}
    const prev=curW(),k=ymd(),i=S.weights.findIndex(x=>x.d===k);if(i>=0)S.weights[i].kg=v;else S.weights.push({d:k,kg:v});
    greet=v<=S.hero.goalW?"Цель взята. Я знал, что ты дойдёшь. Теперь держим.":pick(v<prev?SAY.wdown:v>prev?SAY.wup:SAY.any);
    save();render();toast(v<prev?"Минус "+fmt(prev-v)+" кг. Записано.":"Записано")}
  else if(id==="fform"){const a=num("#f-age");if(!(a>=14&&a<=90)){toast("Введи возраст");return}S.hero.age=a;S.hero.sex=FS;foodEdit=false;save();render()}
  else if(id==="gform"){const v=num("#g-in");if(!(v>=35&&v<S.hero.startW)){toast("Цель должна быть меньше стартового веса");return}
    S.hero.goalW=v;save();render();toast("Новая цель: "+fmt(v)+" кг")}
});
setInterval(()=>{
  if(W&&W.end!=null){const left=(W.end-Date.now())/1000,el=$("#wt");
    if(left<=0){beep();if(W.phase==="rest"){W.phase="work";W.end=null;showOv(vWorkout())}else stepDone()}else if(el)el.textContent=mmss(left)}
  const w=S.walk;if(w&&w.mode==="timer"&&tab==="walk"&&!W&&$("#ov").hidden){const left=w.dur*60-(Date.now()-w.start)/1000,el=$("#wtimer");
    if(left<=0&&!w.rang){w.rang=true;saveLocal();beep();render()}else if(el&&left>0)el.textContent=mmss(left)}
},400);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.hero&&$("#ov").hidden&&document.activeElement.tagName!=="INPUT"){if(S.walk)wake();render()}});

/* ───────── запуск ───────── */
function boot(){
  paintDay();
  if(!S.hero){render();showOv(vOnboard());return}
  $("#ov").hidden=true;
  const r=reconcile();if(r>0){greet=pick(SAY.spare);save()}else if(r<0&&!isActive(ymd()))greet=pick(SAY.back);
  if(S.walk&&S.walk.mode==="gps"){if(Date.now()-S.walk.start>6*36e5){bank();S.walk=null;save()}else watch()}
  render();
}
